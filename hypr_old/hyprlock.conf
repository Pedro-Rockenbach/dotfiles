# ==========================================
# CONFIGURAÇÃO HYPRLOCK - ESTILO TERMINAL TTY
# ==========================================

background {
    monitor =
    color = rgb(0, 0, 0) # Fundo totalmente preto
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 0 # Remove qualquer borda externa
    
    # Cores de fundo do input (totalmente transparente)
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0)
    
    # Configuração dos caracteres de senha
    font_color = rgb(255, 255, 255) # Asteriscos brancos
    fade_on_empty = false
    rounding = 0
    
    # Define o caractere de ocultação como o asterisco clássico (*)
    dots_size = 5.0     # Tamanho dos asteriscos
    dots_spacing = 0.3    # Espaçamento entre eles
    dots_center = true
    dots_text_format = *  # Força o uso do caractere '*'
    
    # Simulando o cursor em bloco branco da imagem
    # O hyprlock usa uma barra vertical por padrão, mas podemos engordá-la
    placeholder_text = <span foreground="##ffffff" size="30000">💀💀💀💀💀💀</span> # Cursor quando vazio
    
    # Posição centralizada na tela
    position = 0, 0
    halign = center
    valign = center
}
