bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, W, killactive,
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, T, togglefloating,
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, B, exec, $browser
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, O, exec, obsidian
bind = $mainMod, N, exec, kitty -e nvim
bind = $mainMod, M, exec, spotify
bind = $mainMod SHIFT, F, fullscreen, 0
bindd = SUPER, BACKSPACE, Toggle opaque and noblur, exec, hyprctl --batch 'dispatch setprop active opaque toggle; dispatch setprop active noblur toggle; '


bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Navegação rápida sequencial
bind = $mainMod ALT, right, workspace, e+1
bind = $mainMod ALT, left, workspace, e-1

# --- Controle do Mouse ---
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- Navegação de Foco ---
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# --- Movimentação de Janelas---
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,  movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Redimensionar Janelas (Grow)
binde = $mainMod, EQUAL, resizeactive, 40 0
binde = $mainMod, MINUS, resizeactive, -40 0
binde = $mainMod SHIFT, EQUAL, resizeactive, 0 40
binde = $mainMod SHIFT, MINUS, resizeactive, 0 -40

# Scratchpad
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# --- Audio Controls ---
# Increase Volume (Allows going up to 150% volume)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+

# Decrease Volume
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

# Mute/Unmute Audio
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# --- Media Controls ---
# Play/Pause Track
bindl = , XF86AudioPlay, exec, playerctl play-pause

# Next Track
bindl = , XF86AudioNext, exec, playerctl next

# Previous Track
bindl = , XF86AudioPrev, exec, playerctl previous

# --- Brightness Controls ---
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86AudioLowerBrightness, exec, brightnessctl set 5%-

# Capturar uma área selecionada e abrir no Satty
# bind = , Print, exec,  grim -g "$(slurp)" - | satty --filename - --fullscreen --output-filename ~/Pictures/Screenshots/satty-$(date +%Y%m%d-%H%M%S).png
bind = , Print, exec, bash -c 'grim -g "$(slurp)" - | satty --filename - --output-filename ~/Pictures/Screenshots/satty-$(date +%Y%m%d-%H%M%S).png'

# Capturar a tela cheia e abrir no Satty (Modificador Super + Print)
# bind = $mainMod, Print, exec, grim - | satty --filename - --fullscreen --output-filename ~/Imagens/Screenshots/satty-$(date +%Y%m%d-%H%M%S).png

# Atalhos para desligar/ suspender/ lockar/ reiniciar o pc
# Entrar no submap
bind = $mainMod, END, submap, power

# Definição do submap
submap = power

# Ações
bind = , S, exec, hyprctl dispatch submap reset && systemctl suspend
bind = , D, exec, systemctl poweroff
bind = , R, exec, systemctl reboot
bind = , L, exec, hyprctl dispatch submap reset && hyprlock

# Sair do submap
bind = , ESCAPE, submap, reset
bind = , Return, submap, reset

# Volta ao mapa padrão
submap = reset

# Seletor visual de wallpapers com Wofi
bind = $mainMod ALT, SPACE, exec, ~/.config/hypr/scripts/seletor_wallpaper.sh
# Muda o wallpaper aleatoriamente usando o swww
bind = $mainMod SHIFT, W, exec, ~/.config/hypr/scripts/mudar_wallpaper.sh
